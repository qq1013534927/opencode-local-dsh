<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- 本机 OpenCode 通道: a terminal chevron routing into an account-owned lane -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2333"/>
      <stop offset="1" stop-color="#10141f"/>
    </linearGradient>
    <linearGradient id="lane" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="88" height="88" rx="20" fill="url(#bg)" stroke="#2b3648" stroke-width="2"/>
  <!-- terminal prompt chevron -->
  <path d="M22 30 L38 42 L22 54" fill="none" stroke="url(#lane)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- prompt underscore -->
  <rect x="44" y="48" width="14" height="7" rx="3.5" fill="url(#lane)"/>
  <!-- route: request flows from the local box up to the account lane -->
  <path d="M30 66 C 46 66, 44 50, 62 50" fill="none" stroke="#8ea3c8" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 7"/>
  <circle cx="30" cy="66" r="5" fill="#5eead4"/>
  <path d="M62 41 L74 50 L62 59 Z" fill="#38bdf8"/>
</svg>
