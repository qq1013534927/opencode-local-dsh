name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check JS syntax
        run: |
          for f in $(find . -name '*.js' -o -name '*.mjs' | grep -v node_modules); do
            node --check "$f" || exit 1
          done
          echo "All files pass syntax check"
